name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'refactor/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run test:worker
      - run: npm run typecheck
      - name: Verify rendered production Worker config
        env:
          CLOUDFLARE_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
        run: |
          npm run render:wrangler:production
          npx wrangler deploy --dry-run --config .wrangler.production.jsonc
      - run: npm run worker:build
      - name: Verify canonical PWA build
        run: |
          npm run build -- --base=/snekrenaissance/
          npm run verify:pwa -- --base=/snekrenaissance/
      - name: Verify synthetic fork PWA build
        run: |
          npm run build -- --base=/snek-experiment/
          npm run verify:pwa -- --base=/snek-experiment/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
