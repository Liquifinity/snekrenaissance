name: audit dead code

on:
  push:
    branches:
      - 'refactor/public-repo-purification-7d'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Candidate references
        run: |
          echo '=== candidate imports/references ==='
          rg -n "flight|grid-traversal|torus|game/types|flight-presentation|pixel-resolution|constants" src tests --glob '*.ts' || true
          echo '=== retired-generation residue ==='
          rg -n "Pixel Flight|V2\.1|V2\.2|SNEK CORE V3|SNEK CORE V4|historical|flight-presentation|torus" src tests package.json .github scripts --glob '!docs/**' || true
