name: deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Capture release SHA
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          test -n "$RELEASE_SHA"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "${CLOUDFLARE_D1_DATABASE_ID:-}" || { echo "CLOUDFLARE_D1_DATABASE_ID is missing"; exit 1; }
          [[ "$CLOUDFLARE_D1_DATABASE_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || { echo "CLOUDFLARE_D1_DATABASE_ID is malformed"; exit 1; }
          test "$CLOUDFLARE_D1_DATABASE_ID" != "00000000-0000-0000-0000-000000000000" || { echo "CLOUDFLARE_D1_DATABASE_ID is still the placeholder"; exit 1; }

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Frontend tests
        run: npm test

      - name: Worker tests
        run: npm run test:worker

      - name: Typecheck
        run: npm run typecheck

      - name: Worker neutral dry-run
        run: npm run worker:build

      - name: Frontend neutral build
        run: npm run build

      - name: Render production Worker config
        run: npm run render:wrangler:production

      - name: Production Worker config dry-run
        run: npx wrangler deploy --dry-run --config .wrangler.production.jsonc

      - name: Inspect production D1 migrations
        run: npx wrangler d1 migrations list snekrenaissance-leaderboard --remote --config .wrangler.production.jsonc

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply snekrenaissance-leaderboard --remote --config .wrangler.production.jsonc

      - name: Deploy ranking Worker
        run: npx wrangler deploy --config .wrangler.production.jsonc

      - name: Resolve Worker production origin
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/subdomain`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const payload = await response.json();
          const subdomain = payload?.result?.subdomain;
          if (!response.ok || payload?.success !== true || typeof subdomain !== 'string' || subdomain.length === 0) {
            throw new Error('Unable to resolve the Cloudflare Workers subdomain.');
          }
          const workerUrl = `https://snekrenaissance-api.${subdomain}.workers.dev`;
          appendFileSync(process.env.GITHUB_ENV, `WORKER_URL=${workerUrl}\n`);
          NODE

      - name: Build ranked frontend
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WORKER_URL:-}" || { echo "WORKER_URL is empty"; exit 1; }
          export VITE_RANKING_API_BASE="$WORKER_URL"
          npm run build
          grep -R -F "$WORKER_URL" dist/assets >/dev/null || { echo "Ranked Worker origin was not compiled into dist"; exit 1; }

      - name: Ensure Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages project list --json > pages-projects.json
          PROJECT_STATE="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('pages-projects.json', 'utf8'));
          const projects = Array.isArray(payload) ? payload : (payload?.result ?? payload?.projects ?? []);
          if (!Array.isArray(projects)) throw new Error('Unexpected Pages project list payload.');
          console.log(projects.some((project) => project?.name === 'snekrenaissance') ? 'exists' : 'absent');
          NODE
          )"
          if [ "$PROJECT_STATE" = "absent" ]; then
            npx wrangler pages project create snekrenaissance --production-branch main
          elif [ "$PROJECT_STATE" != "exists" ]; then
            echo "Unexpected Pages project state: $PROJECT_STATE"
            exit 1
          fi

      - name: Deploy Pages production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist --project-name snekrenaissance --branch main --commit-hash "$RELEASE_SHA"
          echo "PAGES_URL=https://snekrenaissance.pages.dev" >> "$GITHUB_ENV"

      - name: Smoke production
        run: node scripts/smoke-production.mjs

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SNEK RENAISSANCE production release"
            echo ""
            echo "Release SHA: ${RELEASE_SHA:-unknown}"
            echo "Worker: ${WORKER_URL:-not-resolved}"
            echo "Pages: ${PAGES_URL:-not-resolved}"
          } >> "$GITHUB_STEP_SUMMARY"
