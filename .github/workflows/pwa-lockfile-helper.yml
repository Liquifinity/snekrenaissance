name: pwa lockfile helper

on:
  push:
    branches: [feat/pwa-fork-first]
    paths:
      - '.github/workflows/pwa-lockfile-helper.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-dev --save-exact vite-plugin-pwa@2.0.0 --package-lock-only
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add vite PWA dependency"
          git push
